name: Verify two Pi contribution candidates
on:
  push:
    branches: [verify/two-contributions-20261028]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout verification snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install the upstream test system prerequisites
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find ripgrep
          if ! command -v fd >/dev/null; then sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd; fi
          node --version
          rustc --version
      - name: Install exact dependencies without lifecycle scripts
        timeout-minutes: 10
        run: npm ci --ignore-scripts
      - name: Build all packages through the upstream build
        timeout-minutes: 12
        run: npm run build
      - name: Verify genuine regression controls and fixed candidates
        timeout-minutes: 8
        run: python3 .candidate-ci/regressions.py
      - name: Check neighboring interactive and streamable HTTP behavior
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cd packages/coding-agent
          node ../../node_modules/vitest/dist/cli.js --run test/interactive-mode-status.test.ts test/interactive-tui.test.ts test/interactive-mode-startup-input.test.ts
          cd ../mcp
          node ../../node_modules/vitest/dist/cli.js --run test/streamable-http.test.ts test/sse-line-endings.test.ts
      - name: Build the upstream pi-env daemon prerequisite
        timeout-minutes: 10
        run: npm run build:daemon --workspace packages/env
      - name: Run the complete upstream code checks
        timeout-minutes: 10
        run: npm run check
      - name: Run the complete isolated non-model suite
        timeout-minutes: 25
        run: ./test.sh
      - name: Run the additional upstream MCP conformance gate
        timeout-minutes: 10
        run: npm run test:mcp-conformance
      - name: Record the post-check working tree
        if: always()
        run: |
          mkdir -p .candidate-results
          git status --short > .candidate-results/post-check-status.txt
          git diff > .candidate-results/post-check-diff.patch
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pi-contribution-results
          path: .candidate-results
          retention-days: 7
          if-no-files-found: warn
